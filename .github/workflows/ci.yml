name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests · python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # The APK fixture is built by aapt2/d8/apksigner rather than checked in,
      # so the parsers run against genuine compiler output. Without the SDK the
      # fixture-backed tests skip instead of failing — see tests/conftest.py.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Install
        run: pip install -e ".[dev]"

      - name: Build the Android fixture
        run: tests/fixtures/build_android_fixture.sh

      - name: Test
        run: pytest --cov=masa --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  ios:
    name: tests · ios fixture (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # clang against the iPhoneOS SDK; needs a macOS runner, so the iOS
      # analyzer tests live in their own job rather than the matrix above.
      - name: Build the iOS fixture
        run: tests/fixtures/build_ios_fixture.sh

      - name: Test
        run: pytest tests/test_analyzers_ios.py tests/test_core.py tests/test_cli.py

  scan-self:
    name: scan the demo package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Install
        run: pip install -e .

      - name: Build the Android fixture
        run: tests/fixtures/build_android_fixture.sh

      # The demo app is intentionally vulnerable, so exit 1 (findings at or above
      # --fail-on) is the pass condition. 0 means the analyzer stopped detecting
      # things; 2 and 3 mean it refused the package or crashed. Assert on the
      # exact code rather than just inverting it, so a crash cannot pass.
      - name: Scan
        run: |
          set +e
          masa scan tests/fixtures/vulnerable-demo.apk \
            --fail-on high --format all --output demo-report
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::expected exit 1 (findings found), got $code"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: demo-report
          path: |
            demo-report.html
            demo-report.json
          retention-days: 14

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: masa:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: docker run --rm --network none masa:ci version
